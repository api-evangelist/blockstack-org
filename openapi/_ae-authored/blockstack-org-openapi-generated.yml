  /v2/accounts/{principal}:
    get:
      operationId: get_v2_accounts_principal
      tags:
      - Accounts
      summary: Get account info
      description: 'Get the account data for the provided principal


        Where balance is the hex encoding of a unsigned 128-bit integer (big-endian), nonce is a unsigned 64-bit integer, and the proofs are provided
        as hex strings.


        For non-existent accounts, this does not 404, rather it returns an object with balance and nonce of 0.'
      x-source: https://docs.stacks.co/reference/api/stacks-node-rpc/accounts.md
      parameters:
      - name: principal
        in: path
        required: true
        schema:
          type: string
      - name: proof
        in: query
        required: false
        schema:
          type: string
        description: 'Controls MARF proof inclusion in response. Set to 1 (default) to include proof, 0 to exclude.

          Invalid values default to 0 (no proof).'
      - name: tip
        in: query
        required: false
        schema:
          type: string
        description: "Stacks chain tip to query from. Options:\n- (empty/omitted): Use latest anchored tip (canonical confirmed state)\n- `latest`:\
          \ Use latest known tip including unconfirmed microblocks.\n  If no unconfirmed state is available, falls back to the confirmed canonical\
          \ tip.\n  If the unconfirmed state check fails with an error, returns 404.\n- `{block_id}`: Use specific block ID (64 lowercase hex\
          \ characters)\n\n**Note:** If `tip` is present but contains an invalid or malformed value\n(i.e., not `latest` and not a valid 64-character\
          \ hex block ID),\nthe node silently falls back to the latest anchored tip (same as omitting `tip`)."
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetV2AccountsPrincipalResponse'
      x-evidence:
        kind: documentation
